name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Syntax check
        run: python -m compileall -q .
      - name: Mapping self-test
        run: |
          pip install numpy
          cd jetson_software && python jetson_mapping_test.py
      - name: EKF simulation test
        run: cd jetson_software && python ekf_test.py
