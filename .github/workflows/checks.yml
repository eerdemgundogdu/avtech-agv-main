name: checks
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Syntax check
        run: python -m compileall -q .
      - name: Mapping self-test
        run: |
          pip install numpy
          cd jetson_software && python jetson_mapping_test.py
      - name: EKF simulation test
        run: cd jetson_software && python ekf_test.py

  firmware-host-tests:
    # Arduino'dan bagimsiz firmware modulleri (JSON komut okuyucu, hoverboard
    # cerceve kodlayici, rampa) host'ta -Werror ve ASan/UBSan ile test edilir.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware_tests -B build/test
      - name: Build
        run: cmake --build build/test
      - name: Test
        run: ctest --test-dir build/test --output-on-failure

  firmware-build:
    # Teensy 4.1 firmware'ini derler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
