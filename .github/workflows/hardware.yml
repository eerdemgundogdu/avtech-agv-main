name: hardware
on:
  push:
    paths: ['hardware/**', '.github/workflows/hardware.yml']
  pull_request:
    paths: ['hardware/**', '.github/workflows/hardware.yml']

jobs:
  kicad:
    # Tasiyici kart: KiCad 9 ile ERC ve sematik paritesi dahil DRC.
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      # imaj varsayilan olarak 'kicad' kullanicisiyla calisir; checkout icin root gerekir
      options: --user root
    defaults:
      run:
        working-directory: hardware/avtech-agv-carrier
    steps:
      - uses: actions/checkout@v4
      - name: ERC
        run: |
          kicad-cli sch erc --format json --severity-error --exit-code-violations \
            -o /tmp/erc.json avtech-agv-carrier.kicad_sch && ok=1 || ok=0
          python3 - <<'EOF'
          import json
          d = json.load(open('/tmp/erc.json'))
          for s in d.get('sheets', []):
              for v in s.get('violations', []):
                  items = '; '.join(i.get('description', '') for i in v.get('items', []))
                  print(f"::{'error' if v['severity'] == 'error' else 'warning'}::ERC {v['type']}: {v['description']} [{items}]")
          EOF
          test "$ok" = 1
      - name: DRC (sematik paritesi dahil)
        run: |
          kicad-cli pcb drc --format json --schematic-parity --refill-zones \
            --severity-error --exit-code-violations \
            -o /tmp/drc.json avtech-agv-carrier.kicad_pcb > /tmp/drc.log 2>&1 && ok=1 || ok=0
          sed 's/^/::notice::kicad-cli: /' /tmp/drc.log | head -20
          python3 - <<'EOF'
          import json, os
          if not os.path.exists('/tmp/drc.json'):
              print('::error::DRC raporu olusmadi')
              raise SystemExit
          d = json.load(open('/tmp/drc.json'))
          for key, val in d.items():
              if not isinstance(val, list):
                  continue
              print(f'::notice::{key}: {len(val)}')
              for v in val[:30]:
                  items = '; '.join(i.get('description', '') for i in v.get('items', []))
                  sev = v.get('severity', 'error')
                  print(f"::{'error' if sev == 'error' else 'warning'}::{key} {v.get('type')}: {v.get('description')} [{items}]")
          EOF
          test "$ok" = 1
