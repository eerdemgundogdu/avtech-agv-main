; Teensy 4.1 firmware'i PlatformIO ile derler:
;   pio run              # derle
;   pio run -t upload    # yukle
; Arduino IDE + Teensyduino ile teensy_firmware/teensy_firmware.ino da acilabilir.

[platformio]
src_dir = teensy_firmware

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D USB_SERIAL
build_src_filter = +<*> -<comm_test/>
monitor_speed = 115200

; Rev A tasiyici kart ile (hardware/): E-stop algilama ve MOTOR_EN etkin
[env:teensy41_carrier]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -D CARRIER_BOARD_REV=1
